name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          xcrun swift --version

      - name: Tests
        run: scripts/test.sh

      # Optional Developer ID signing and notarization. Without these secrets the
      # app is signed ad hoc, exactly as before.
      #   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
      #   MACOS_CERT_PASSWORD   its export password
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Porthole.app
        run: scripts/build.sh

      - name: Smoke test the CLI
        run: |
          lipo -archs dist/Porthole.app/Contents/MacOS/Porthole
          dist/Porthole.app/Contents/MacOS/Porthole --help
          dist/Porthole.app/Contents/MacOS/Porthole --list

      - name: Package
        run: ditto -c -k --keepParent dist/Porthole.app dist/Porthole.zip

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && startsWith(github.ref, 'refs/tags/v')
        run: |
          xcrun notarytool submit dist/Porthole.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist/Porthole.app
          rm dist/Porthole.zip
          ditto -c -k --keepParent dist/Porthole.app dist/Porthole.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Porthole
          path: dist/Porthole.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Porthole.zip
          generate_release_notes: true

      # Needs a TAP_TOKEN secret: a fine-grained token with contents:write on ayxos/homebrew-tap.
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/Porthole.zip | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ayxos/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/porthole.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "porthole $VERSION"
          git push
